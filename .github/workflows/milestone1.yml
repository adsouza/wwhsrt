name: First business
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  # The memory caps in TESTING.md protect a developer machine; hosted runners have room to spare.
  WWHSRT_UNCAPPED: '1'
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - name: Linux renderer test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1 libgl1-mesa-dri libx11-6 libxcursor1 \
            libxext6 libxi6 libxinerama1 libxrandr2 libxrender1
      - run: python3 tools/check-boundaries.py
      - name: Vet native and browser targets
        run: |
          go vet ./...
          GOOS=js GOARCH=wasm go vet ./...
      - run: xvfb-run -a go test ./...

  # Race and fuzz share a runner: together they still finish well inside the browser jobs, and the
  # slot they free lets every browser job start at once under the 20-job concurrency limit.
  race-and-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - run: go test -race ./internal/application ./internal/adapters/filestore
      - name: Bounded fuzz campaigns
        # The campaigns are independent and time-boxed, so they share the runner's cores.
        run: |
          targets=(internal/application:FuzzRestoreNeverPanics internal/domain:FuzzNetworkConservation
                   pkg/mapview:FuzzProjectionIsFinite)
          pids=()
          for target in "${targets[@]}"; do
            go test "./${target%%:*}" -run '^$' -fuzz "${target#*:}" -fuzztime 10s -parallel 2 \
              > "$RUNNER_TEMP/${target#*:}.log" 2>&1 &
            pids+=($!)
          done
          status=0
          for i in "${!targets[@]}"; do
            name=${targets[$i]#*:}
            if wait "${pids[$i]}"; then echo "== $name passed"; else echo "== $name FAILED"; status=1; fi
            cat "$RUNNER_TEMP/$name.log"
          done
          exit "$status"
      - name: Collect failing inputs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/fuzz"
          git ls-files -z --others --exclude-standard -- '*/testdata/fuzz/*' | xargs -0 -r cp --parents -t "$RUNNER_TEMP/fuzz"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-failures
          path: ${{ runner.temp }}/fuzz
          if-no-files-found: ignore

  data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The runner's system Python moves with the image; scipy 1.14.1 has wheels up to 3.13.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-*.txt
      - run: python -m pip install -r tools/requirements-geography.txt -r tools/requirements-public-network.txt
      - name: Geography and public-network checks
        # The checks only read committed data, so they run in three lanes balanced by measured time:
        # launch prospects alone (~40 s locally), the two preparation checks (~35 s), and the rest (~6 s).
        run: |
          lane() {
            local name=$1 check argv; shift
            for check in "$@"; do
              echo "+ python $check"
              read -ra argv <<< "$check"
              python "${argv[@]}" || return 1
            done > "$RUNNER_TEMP/$name.log" 2>&1
          }
          names=(prospects preparation network)
          pids=()
          lane prospects tools/check-launch-prospects.py & pids+=($!)
          lane preparation 'tools/prepare-network-repairs.py --check' 'tools/prepare-launch-prospects.py --check' &
          pids+=($!)
          lane network tools/check-route-geography.py 'tools/import-public-network.py --check' \
            tools/check-regional-network.py tools/test-network-coverage.py 'tools/audit-public-network.py --check --strict' &
          pids+=($!)
          status=0
          for i in "${!names[@]}"; do
            name=${names[$i]}
            if wait "${pids[$i]}"; then echo "== $name passed"; else echo "== $name FAILED"; status=1; fi
            cat "$RUNNER_TEMP/$name.log"
          done
          exit "$status"
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          git ls-files -z --modified --others --exclude-standard -- docs/validation |
            xargs -0 -r cp --parents -t "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-data
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - run: sh tools/build-web.sh
      - run: mkdir -p build && go build -o build/ ./cmd/headless ./cmd/webserve
      - uses: actions/upload-artifact@v7
        with:
          name: web-bundle
          path: |
            web/
            build/headless
            build/webserve
          retention-days: 7
          if-no-files-found: error

  browser:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Each entry is one runner. Long checkers (workspace and milestone3 take over two minutes) run
        # alone; short ones share a runner so the browser jobs and the five other jobs still running
        # stay under the 20-job concurrency limit, and no long checker waits in the queue.
        checks:
          - workspace
          - milestone3
          - map-services
          - onboarding
          - funding
          - capacity
          - idle-review
          - theme
          - new-game
          - coastlines
          - terrain
          - business
          - milestone2
          - economy
          - prospects
          - public-network campaign-completion
          - osaka-map playable-map existing-connections
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Headless launches use the headless shell, so the full browser is not needed.
      - run: npx playwright install --with-deps --only-shell chromium
      - uses: actions/download-artifact@v8
        with:
          name: web-bundle
      - run: chmod +x build/headless build/webserve
      - name: Check ${{ matrix.checks }}
        env:
          CHECKS: ${{ matrix.checks }}
          NODE_OPTIONS: --max-old-space-size=1536
        run: |
          build/webserve > "$RUNNER_TEMP/webserve.log" 2>&1 &
          for _ in $(seq 100); do curl -fsS -o /dev/null http://127.0.0.1:8765/ && break; sleep 0.1; done
          status=0
          for check in $CHECKS; do
            args=()
            # The hosted gate is the isolated campaign-end footer check, not a second full WASM start.
            if [ "$check" = campaign-completion ]; then args=(--layout); fi
            echo "== $check"
            node "tools/check-$check.cjs" "${args[@]}" || status=1
          done
          exit "$status"
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          git ls-files -z --modified --others --exclude-standard -- docs/validation |
            xargs -0 -r cp --parents -t "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-${{ matrix.checks }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore

  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - name: Build every command
        run: go build -trimpath ./cmd/...
      - name: Validate macOS app packaging
        if: runner.os == 'macOS'
        run: |
          sh tools/build-native.sh
          plutil -lint 'build/World-wide High-speed Rail Tycoon.app/Contents/Info.plist'
          test -s 'build/World-wide High-speed Rail Tycoon.app/Contents/Resources/AppIcon.icns'

  # Publish the browser build that every other job just checked to https://adsouza.github.io/wwhsrt/.
  # Only main deploys (pull requests have a refs/pull ref, and the github-pages environment admits
  # main alone); a failed job anywhere keeps the previous build live.
  pages:
    if: github.ref == 'refs/heads/main'
    needs: [test, race-and-fuzz, data, web, browser, native]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web-bundle
      # The checked bundle, not a rebuild; the headless and webserve tools stay out of the site.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/
      - id: deploy
        uses: actions/deploy-pages@v5
