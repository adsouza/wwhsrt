<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">World-wide High-speed Rail Tycoon app icon</title>
  <desc id="desc">A white high-speed train with a sweeping blue windshield and yellow headlamps on a rounded blue tile.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#2389ED"/>
      <stop offset="1" stop-color="#124DB7"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#245C91"/>
      <stop offset="1" stop-color="#143252"/>
    </linearGradient>
    <clipPath id="tile-edge">
      <rect x="8" y="8" width="240" height="240" rx="55"/>
    </clipPath>
    <clipPath id="train-edge">
      <path d="M72 157c0-14 5-36 12-58 8-25 23-40 44-40s36 15 44 40c7 22 12 44 12 58 0 26-21 37-56 37s-56-11-56-37Z"/>
    </clipPath>
  </defs>
  <g id="background" clip-path="url(#tile-edge)">
    <rect x="8" y="8" width="240" height="240" fill="url(#tile)"/>
    <circle cx="180" cy="72" r="31" fill="#FFC247"/>
    <path d="M-12 168C64 142 119 114 161 72M-11 196C76 169 146 132 200 83" fill="none" stroke="#8FD8FF" stroke-width="3" opacity=".44"/>
    <path d="M12 227c63-15 134-15 232-76v97H8Z" fill="#143252" opacity=".14"/>
  </g>
  <g id="rails" fill="none" stroke-linecap="round">
    <path d="m102 179-29 44m81-44 29 44" stroke="#143252" stroke-width="15"/>
    <path d="m102 179-29 44m81-44 29 44" stroke="#8AE7D4" stroke-width="7"/>
  </g>
  <g id="train">
    <path d="M72 157c0-14 5-36 12-58 8-25 23-40 44-40s36 15 44 40c7 22 12 44 12 58 0 26-21 37-56 37s-56-11-56-37Z" fill="#F2F9FF" stroke="#143252" stroke-width="8" stroke-linejoin="round"/>
    <g clip-path="url(#train-edge)">
      <path d="M70 151q58 36 116 0v45H70Z" fill="#D6F0FF"/>
      <path d="M72 161q56 35 112 0" fill="none" stroke="#0BAF9B" stroke-width="8"/>
    </g>
    <path d="M92 110c7-25 18-38 36-38s29 13 36 38c3 9-1 17-10 19-18 5-34 5-52 0-9-2-13-10-10-19Z" fill="url(#glass)"/>
    <path d="M103 100c7-13 15-19 25-19 8 0 16 4 22 12-14-6-30-4-47 7Z" fill="#CDEEFF" opacity=".62"/>
    <path d="m89 146 13 4m65-4-13 4" stroke="#FFC247" stroke-width="8" stroke-linecap="round"/>
    <path d="M119 164q9 2 18 0" stroke="#143252" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
