<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      canvas {
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <script>
      document.documentElement.style.background =
        parent.document.documentElement.dataset.theme === 'dark' ? '#0c2438' : '#cdeeff';
    </script>
    <script src="wasm_exec.js"></script>
    <script>
      const go = new Go();
      WebAssembly.instantiateStreaming(fetch('main.wasm'), go.importObject)
        .then((x) => go.run(x.instance))
        .catch(() => parent.railStartupError('startupFailed'));
    </script>
  </body>
</html>
