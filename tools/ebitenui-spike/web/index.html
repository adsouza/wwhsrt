<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Actual ebitenui rendering spike</title><style>html,body{margin:0;width:100%;height:100%;background:#f6f7f4;overflow:hidden}#loading{font:16px system-ui;padding:24px;color:#183334}</style></head><body><p id="loading">Loading the actual Go/Ebitengine/ebitenui build…</p><script src="wasm_exec.js"></script><script>
